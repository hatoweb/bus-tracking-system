# Fragmento para sistemas.mopc.gov.py
# Proxy hacia GeoBus en 172.16.222.222:3009 bajo /prototipo_vmt
#
# IMPORTANTE:
# - NO quitar el prefijo /prototipo_vmt al hacer proxy (la app tiene basePath).
# - Recargar nginx después: nginx -t && systemctl reload nginx

# Redirigir sin barra final
location = /prototipo_vmt {
    return 301 /prototipo_vmt/;
}

# Auth.js a veces redirige a /login sin basePath → 404 nginx
location = /login {
    return 302 /prototipo_vmt/login$is_args$args;
}

location /prototipo_vmt/ {
    proxy_pass http://172.16.222.222:3009/prototipo_vmt/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts (planificar viaje / GPS)
    proxy_connect_timeout 15s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
