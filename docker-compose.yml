services:
  bus-tracking-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Debe coincidir con location de nginx en sistemas.mopc.gov.py
        BASE_PATH: /prototipo_vmt
    container_name: bus_tracking_app
    ports:
      # Host 3009 libre en 172.16.222.222
      - "3009:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BASE_PATH: /prototipo_vmt
      NEXT_PUBLIC_BASE_PATH: /prototipo_vmt
      # Auth.js: AUTH_* deben estar en .env (AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET)
      AUTH_URL: ${AUTH_URL:-https://sistemas.mopc.gov.py/prototipo_vmt}
      # Si .env no define la URL, no usar 127.0.0.1 dentro del contenedor
      GEO_ITINERARIOS_URL: ${GEO_ITINERARIOS_URL:-http://host.docker.internal:8020}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # HTTPS directo (GPS) — opcional si ya usan sistemas.mopc.gov.py con HTTPS
  bus-tracking-https:
    image: caddy:2-alpine
    container_name: bus_tracking_https
    ports:
      - "3443:3443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bus-tracking-app
    restart: always

volumes:
  caddy_data:
  caddy_config:
