services:
  bus-tracking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus_tracking_app
    ports:
      # Host 3009 libre en 172.16.222.222 (3000/3002/3003/3008 ocupados o reservados)
      - "3009:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # HTTPS para que el navegador permita geolocalización (GPS)
  bus-tracking-https:
    image: caddy:2-alpine
    container_name: bus_tracking_https
    ports:
      - "3443:3443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bus-tracking-app
    restart: always

volumes:
  caddy_data:
  caddy_config:
